name: Coding agent single-run Harness
description: Execute one coding request with Codex or Claude Code; the caller owns authorization and publication
inputs:
  request:
    description: Validated generic coding request v3.0
    required: true
  execution-id:
    description: Correlation identifier
    required: true
  workspace:
    description: Absolute path to target checkout without persisted credentials
    required: true
  openai-api-key:
    description: OpenAI credential supplied only to the official API proxy; required when the request's worker is codex
    required: false
    default: ''
  anthropic-api-key:
    description: Anthropic credential supplied only to the harness credential proxy; the claude worker needs this or claude-oauth-token
    required: false
    default: ''
  claude-oauth-token:
    description: OAuth token of a Claude subscription (claude setup-token), supplied only to the harness credential proxy instead of anthropic-api-key
    required: false
    default: ''
  trusted-bot-users:
    description: Explicit trusted GitHub App bot logins from the reviewed caller workflow; never derive from request or actor
    required: false
    default: ''
  loopback:
    description: Set 'true' to let commands bind and connect on a private loopback interface; all other network stays closed
    required: false
    default: 'false'
  browser-cache:
    description: Existing directory of Playwright browsers under RUNNER_TEMP or HOME from the reviewed caller workflow; shared read-only with the coding account
    required: false
    default: ''
outputs:
  usage:
    description: Token usage record of the run (usage.json), written for every run that got past preparation
    value: ${{ steps.prepare.outputs.directory }}/usage.json
  artifact:
    description: Single-run result and bounded file manifest
    value: ${{ steps.prepare.outputs.directory }}/artifact.json
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --ignore-scripts
        npm run build
    - id: prepare
      shell: bash
      env:
        HARNESS_REQUEST: ${{ inputs.request }}
        HARNESS_EXECUTION_ID: ${{ inputs.execution-id }}
        HARNESS_LOOPBACK: ${{ inputs.loopback }}
      run: node "$GITHUB_ACTION_PATH/dist/coding-cli.js" prepare
    - name: Require the credential of the requested worker
      shell: bash
      env:
        WORKER: ${{ steps.prepare.outputs.worker }}
        HAS_OPENAI: ${{ inputs.openai-api-key != '' }}
        HAS_ANTHROPIC: ${{ inputs.anthropic-api-key != '' }}
        HAS_CLAUDE_OAUTH: ${{ inputs.claude-oauth-token != '' }}
      run: |
        if [[ "$WORKER" == codex && "$HAS_OPENAI" != true ]]; then echo "The codex worker needs openai-api-key" >&2; exit 1; fi
        if [[ "$WORKER" == claude && "$HAS_ANTHROPIC" != true && "$HAS_CLAUDE_OAUTH" != true ]]; then echo "The claude worker needs anthropic-api-key or claude-oauth-token" >&2; exit 1; fi
        if [[ "$WORKER" == claude && "$HAS_ANTHROPIC" == true && "$HAS_CLAUDE_OAUTH" == true ]]; then echo "Pass either anthropic-api-key or claude-oauth-token, not both" >&2; exit 1; fi
    - name: Remember the npm manifest before the agent
      shell: bash
      env:
        HARNESS_WORKSPACE: ${{ inputs.workspace }}
        RUN_DIRECTORY: ${{ steps.prepare.outputs.directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/npm-manifest-snapshot.sh"
    - name: Create isolated coding account
      id: account
      shell: bash
      env:
        TARGET: ${{ inputs.workspace }}
        RUN_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        TIMEOUT: ${{ steps.prepare.outputs.timeout }}
        ACCOUNT: ${{ steps.prepare.outputs.account }}
      run: |
        [[ "$RUNNER_OS" == Linux ]]
        [[ "$TARGET" == "$GITHUB_WORKSPACE/target" ]]
        [[ "$ACCOUNT" == codex-worker || "$ACCOUNT" == claude-worker ]]
        sudo adduser --system --home "/home/$ACCOUNT" --shell /bin/bash --group "$ACCOUNT"
        sudo chmod o+x /home/runner /home/runner/work
        sudo chmod o+x "/home/$ACCOUNT"
        sudo chown -R "$ACCOUNT:$ACCOUNT" "$TARGET"
        sudo chmod -R u+rwX "$TARGET"
        chmod o+rx "$RUN_DIRECTORY"
        chmod o+r "$RUN_DIRECTORY/prompt.txt" "$RUN_DIRECTORY/message.schema.json" "$RUN_DIRECTORY/request.json"
        sudo install -d -o "$ACCOUNT" -g "$ACCOUNT" "$RUN_DIRECTORY/output"
        setsid bash "$GITHUB_ACTION_PATH/scripts/coding-deadline.sh" "$TIMEOUT" "$ACCOUNT" </dev/null >/dev/null 2>&1 &
        echo "deadline-pid=$!" >> "$GITHUB_OUTPUT"
    - name: Share prepared browsers read-only
      if: inputs.browser-cache != ''
      shell: bash
      env:
        HARNESS_BROWSER_CACHE: ${{ inputs.browser-cache }}
        HARNESS_ACCOUNT: ${{ steps.prepare.outputs.account }}
      run: bash "$GITHUB_ACTION_PATH/scripts/coding-browser-cache.sh"
    - name: Seed the Codex home with an untrusted checkout
      if: steps.prepare.outputs.worker == 'codex'
      shell: bash
      env:
        TARGET: ${{ inputs.workspace }}
        HARNESS_PROFILE: ${{ steps.prepare.outputs.profile }}
      run: bash "$GITHUB_ACTION_PATH/scripts/coding-home.sh"
    - name: Confine commands to a private loopback
      if: steps.prepare.outputs.worker == 'codex' && steps.prepare.outputs.profile == 'harness-loopback'
      shell: bash
      env:
        TARGET: ${{ inputs.workspace }}
        CODEX_VERSION: '0.167.0' # keep equal to codex-version below
      run: bash "$GITHUB_ACTION_PATH/scripts/coding-loopback.sh"
    - uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
      if: steps.prepare.outputs.worker == 'codex'
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        codex-version: '0.167.0'
        model: ${{ steps.prepare.outputs.model }}
        effort: ${{ steps.prepare.outputs.effort }}
        permission-profile: ${{ steps.prepare.outputs.profile }}
        safety-strategy: unprivileged-user
        codex-user: codex-worker
        working-directory: ${{ inputs.workspace }}
        prompt-file: ${{ steps.prepare.outputs.directory }}/prompt.txt
        output-schema-file: ${{ steps.prepare.outputs.directory }}/message.schema.json
        output-file: ${{ steps.prepare.outputs.directory }}/output/message.json
        allow-bots: 'true'
        allow-bot-users: ${{ inputs.trusted-bot-users }}
    - name: Run Claude Code behind the credential proxy
      if: steps.prepare.outputs.worker == 'claude'
      shell: bash
      env:
        TARGET: ${{ inputs.workspace }}
        RUN_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        HARNESS_MODEL: ${{ steps.prepare.outputs.model }}
        HARNESS_EFFORT: ${{ steps.prepare.outputs.effort }}
        HARNESS_LOOPBACK: ${{ steps.prepare.outputs.loopback }}
        HARNESS_BUDGET_USD: ${{ steps.prepare.outputs.budget }}
        HARNESS_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        HARNESS_CLAUDE_OAUTH_TOKEN: ${{ inputs.claude-oauth-token }}
        CLAUDE_CODE_VERSION: '2.1.318'
      run: bash "$GITHUB_ACTION_PATH/scripts/claude-run.sh"
    - name: Resolve package-lock.json after a dependency change
      shell: bash
      env:
        HARNESS_ACCOUNT: ${{ steps.prepare.outputs.account }}
        HARNESS_WORKSPACE: ${{ inputs.workspace }}
        RUN_DIRECTORY: ${{ steps.prepare.outputs.directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/refresh-lockfile.sh"
    - name: Collect bounded result
      shell: bash
      env:
        HARNESS_ACCOUNT: ${{ steps.prepare.outputs.account }}
        HARNESS_EXECUTION_ID: ${{ inputs.execution-id }}
        HARNESS_WORKSPACE: ${{ inputs.workspace }}
        RUN_DIRECTORY: ${{ steps.prepare.outputs.directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/collect-coding.sh"
    - name: Record token usage
      if: always() && steps.prepare.outputs.directory != ''
      shell: bash
      env:
        HARNESS_WORKER: ${{ steps.prepare.outputs.worker }}
        HARNESS_EXECUTION_ID: ${{ inputs.execution-id }}
        HARNESS_WORKSPACE: ${{ inputs.workspace }}
        RUN_DIRECTORY: ${{ steps.prepare.outputs.directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/record-usage.sh" || echo "Token usage could not be recorded"
    - name: Stop per-run processes
      if: always()
      shell: bash
      env:
        DEADLINE_PID: ${{ steps.account.outputs.deadline-pid }}
        ACCOUNT: ${{ steps.prepare.outputs.account }}
        RUN_DIRECTORY: ${{ steps.prepare.outputs.directory }}
      run: |
        if [[ "$DEADLINE_PID" =~ ^[0-9]+$ ]]; then kill -- "-$DEADLINE_PID" || true; fi
        if [[ "$ACCOUNT" == codex-worker || "$ACCOUNT" == claude-worker ]]; then sudo pkill -KILL -u "$ACCOUNT" || true; fi
        if [[ "$ACCOUNT" == claude-worker ]]; then bash "$GITHUB_ACTION_PATH/scripts/claude-cleanup.sh"; fi
