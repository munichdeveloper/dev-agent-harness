name: Codex single-run Harness
description: Execute one coding request; the caller owns authorization and publication
inputs:
  request:
    description: Validated generic coding request v3.0
    required: true
  execution-id:
    description: Correlation identifier
    required: true
  workspace:
    description: Absolute path to target checkout without persisted credentials
    required: true
  openai-api-key:
    description: OpenAI credential supplied only to the official API proxy
    required: true
  trusted-bot-users:
    description: Explicit trusted GitHub App bot logins from the reviewed caller workflow; never derive from request or actor
    required: false
    default: ''
  loopback:
    description: Set 'true' to let commands bind and connect on a private loopback interface; all other network stays closed
    required: false
    default: 'false'
  browser-cache:
    description: Existing directory of Playwright browsers under RUNNER_TEMP or HOME from the reviewed caller workflow; shared read-only with the coding account
    required: false
    default: ''
outputs:
  artifact:
    description: Single-run result and bounded file manifest
    value: ${{ steps.prepare.outputs.directory }}/artifact.json
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --ignore-scripts
        npm run build
    - id: prepare
      shell: bash
      env:
        HARNESS_REQUEST: ${{ inputs.request }}
        HARNESS_EXECUTION_ID: ${{ inputs.execution-id }}
        HARNESS_LOOPBACK: ${{ inputs.loopback }}
      run: node "$GITHUB_ACTION_PATH/dist/coding-cli.js" prepare
    - name: Create isolated coding account
      id: account
      shell: bash
      env:
        TARGET: ${{ inputs.workspace }}
        RUN_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        TIMEOUT: ${{ steps.prepare.outputs.timeout }}
      run: |
        [[ "$RUNNER_OS" == Linux ]]
        [[ "$TARGET" == "$GITHUB_WORKSPACE/target" ]]
        sudo adduser --system --home /home/codex-worker --shell /bin/bash --group codex-worker
        sudo chmod o+x /home/runner /home/runner/work
        sudo chmod o+x /home/codex-worker
        sudo chown -R codex-worker:codex-worker "$TARGET"
        sudo chmod -R u+rwX "$TARGET"
        chmod o+rx "$RUN_DIRECTORY"
        chmod o+r "$RUN_DIRECTORY/prompt.txt" "$RUN_DIRECTORY/message.schema.json"
        sudo install -d -o codex-worker -g codex-worker "$RUN_DIRECTORY/output"
        setsid bash "$GITHUB_ACTION_PATH/scripts/coding-deadline.sh" "$TIMEOUT" </dev/null >/dev/null 2>&1 &
        echo "deadline-pid=$!" >> "$GITHUB_OUTPUT"
    - name: Share prepared browsers read-only
      if: inputs.browser-cache != ''
      shell: bash
      env:
        HARNESS_BROWSER_CACHE: ${{ inputs.browser-cache }}
      run: bash "$GITHUB_ACTION_PATH/scripts/coding-browser-cache.sh"
    - name: Confine commands to a private loopback
      if: steps.prepare.outputs.profile == 'harness-loopback'
      shell: bash
      env:
        TARGET: ${{ inputs.workspace }}
        CODEX_VERSION: '0.167.0' # keep equal to codex-version below
      run: bash "$GITHUB_ACTION_PATH/scripts/coding-loopback.sh"
    - uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        codex-version: '0.167.0'
        model: ${{ steps.prepare.outputs.model }}
        effort: ${{ steps.prepare.outputs.effort }}
        permission-profile: ${{ steps.prepare.outputs.profile }}
        safety-strategy: unprivileged-user
        codex-user: codex-worker
        working-directory: ${{ inputs.workspace }}
        prompt-file: ${{ steps.prepare.outputs.directory }}/prompt.txt
        output-schema-file: ${{ steps.prepare.outputs.directory }}/message.schema.json
        output-file: ${{ steps.prepare.outputs.directory }}/output/message.json
        allow-bots: 'true'
        allow-bot-users: ${{ inputs.trusted-bot-users }}
    - name: Collect bounded result
      shell: bash
      env:
        HARNESS_EXECUTION_ID: ${{ inputs.execution-id }}
        HARNESS_WORKSPACE: ${{ inputs.workspace }}
        RUN_DIRECTORY: ${{ steps.prepare.outputs.directory }}
      run: bash "$GITHUB_ACTION_PATH/scripts/collect-coding.sh"
    - name: Stop per-run processes
      if: always()
      shell: bash
      env:
        DEADLINE_PID: ${{ steps.account.outputs.deadline-pid }}
      run: |
        if [[ "$DEADLINE_PID" =~ ^[0-9]+$ ]]; then kill -- "-$DEADLINE_PID" || true; fi
        sudo pkill -KILL -u codex-worker || true
