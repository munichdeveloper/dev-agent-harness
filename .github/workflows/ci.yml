name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions: {}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: munichdeveloper/dev-agent-harness
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:coverage
      - name: Exercise restricted Linux artifact collection without API credentials
        run: bash scripts/test-coding-account.sh
      - name: Verify official shared proxy-home setup without sending an API request
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5
        with:
          openai-api-key: ci-fixture-not-a-real-api-key
          codex-version: '0.167.0'
          safety-strategy: unprivileged-user
          codex-user: codex-worker
      - name: Verify proxy server info permissions
        run: |
          test -s "/home/codex-worker/.codex/$GITHUB_RUN_ID.json"
          sudo -u codex-worker test ! -w "/home/codex-worker/.codex/$GITHUB_RUN_ID.json"
      - name: Verify generated contracts are committed
        run: |
          npm run schemas
          git diff --exit-code -- schemas
      - name: Validate Actions syntax with pinned actionlint
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - run: npm audit --audit-level=moderate
